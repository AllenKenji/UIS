services:
  - type: web
    name: bis-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/status
    envVars:
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: CFDP_PROVISION_URL
        sync: false
      - key: CFDP_PROVISION_API_KEY
        sync: false
      - key: CFDP_PROVISION_REQUIRED
        value: "false"
      - key: CFDP_TO_BIS_PROVISION_API_KEY
        sync: false
      - key: CFDP_SURVEY_BASE_URL
        sync: false
      - key: CFDP_SURVEY_HANDOFF_SECRET
        sync: false

  - type: static
    name: bis-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false
      - key: REACT_APP_WS_BASE_URL
        sync: false
      - key: REACT_APP_MAIL_URL
        sync: false
      - key: REACT_APP_CFDP_SURVEY_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
